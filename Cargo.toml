[workspace]
members = ["crates/bongodsh-core", "crates/bongodsh-app"]
default-members = ["crates/bongodsh-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/PetalEcho/BongoDSH"
publish = false

[workspace.dependencies]
bongodsh-core = { path = "crates/bongodsh-core" }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
