name: Rust and DSH checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test available targets
        run: cargo test --workspace --all-features --locked
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Simulated input demo
        run: cargo run --release --locked --bin bongodsh -- --demo
      - name: Check DSH client bundle
        working-directory: plugins/dsh-bongodsh
        run: npm run check
      - name: Check DSH package contents
        working-directory: plugins/dsh-bongodsh
        run: npm pack --dry-run
